<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexo Chatbot</title>
    <link rel="shortcut icon" href="./assets/nexo-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" defer></script>
    <script src="./js/script.js" defer></script>
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <img src="./assets/nexo-night.png" alt="Nexo Bot" class="brand-logo" width="1300" height="310" onerror="this.style.display = 'none'">
        </div>
        <div class="settings">
            <select name="modelSelect" id="modelSelect" title="Modelo">
                <option value="gemini-2.5-flash" selected>Gemini-2.5-flash</option>
                <option value="gemini-3.5-flash-lite">Gemini-3.5-flash-lite</option>
                <option value="gemini-3.1-flash-lite">Gemini-3.1-flash-lite</option>
            </select>
            <button id="themeToggle" class="ghost" type="button" aria-label="Cambiar a modo día" aria-pressed="false">Día</button>
            <button id="clearChatBtn" class="ghost" title="Borrar conversación">Borrar</button>
        </div>
    </header>
    <main class="chat">
        <div id="messages" class="messages" aria-live="polite"></div>
        <form id="composer" class="composer" autocomplete="off">
            <textarea name="prompt" id="prompt" placeholder="Escribe tu mensaje aquí y presiona Enter ..." required></textarea>
            <div class="composer-actions">
                <button id="sendBtn">Enviar</button>
            </div>
        </form>
    </main>
</body>
</html>
